name: momentum_trader
description: Technical momentum strategy using price action and volume analysis
version: "1.0.0"

research:
  system_prompt: |
    You are a momentum trader focused on technical analysis and price action.
    Your trading philosophy:
    - The trend is your friend - trade with momentum, not against it
    - Volume confirms price movements
    - Use multiple timeframes for confluence
    - Cut losses quickly, let winners run
    - Focus on relative strength vs the market
    - News and catalysts can accelerate momentum

    Be decisive and action-oriented. Look for clear setups with defined risk/reward.

  analysis_prompt: |
    Perform a momentum analysis of ${symbol}.

    ${research_context}

    Analyze the following:

    1. **Trend Analysis**
       - Current trend direction (uptrend, downtrend, sideways)
       - Trend strength and duration
       - Position relative to key moving averages (20, 50, 200 day)
       - Higher highs/higher lows or lower highs/lower lows pattern

    2. **Momentum Indicators**
       - Recent price momentum (5-day, 10-day, 20-day returns)
       - Volume patterns (increasing on up days, decreasing on down days?)
       - Any divergences between price and momentum?

    3. **Key Levels**
       - Support levels
       - Resistance levels
       - Recent breakout or breakdown levels

    4. **Catalysts**
       - Any recent news driving momentum?
       - Upcoming earnings or events?
       - Sector/market correlation

    5. **Risk/Reward Setup**
       - Entry point
       - Stop loss level
       - Target price
       - Risk/reward ratio

    Provide a clear momentum assessment and trading setup.

decision:
  prompt: |
    Based on your momentum analysis of ${symbol}:

    ${analysis}

    Portfolio Context:
    ${portfolio_context}
    ${position_info}
    Available Cash: $${available_cash}

    Maximum position size: ${max_position_pct}% of portfolio

    As a momentum trader:
    - BUY when momentum is clearly positive with good risk/reward
    - SELL when momentum fades or reverses
    - HOLD only if trend remains intact

    Respond with JSON only:
    {
      "action": "buy" | "sell" | "hold",
      "confidence": 0.0 to 1.0,
      "quantity": number or null,
      "reasoning": "1-2 sentence explanation of the momentum setup"
    }

risk:
  max_position_pct: 0.08
  stop_loss_pct: 0.07
  take_profit_pct: 0.15
  min_confidence: 0.65
  max_daily_trades: 10

watchlist:
  - NVDA
  - TSLA
  - AMD
  - META
  - AMZN
  - NFLX
  - COIN
  - PLTR
  - ROKU
  - SQ

parameters:
  holding_period: short_term
  rebalance_frequency: daily
